apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nexus3.fullname" . }}
  labels:
    {{- include "nexus3.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nexus3.fullname" . }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus3.selectorLabels" . | nindent 6 }}
  podManagementPolicy: {{ .Values.statefulset.podManagementPolicy | default "OrderedReady" }}
  updateStrategy:
    type: {{ .Values.statefulset.updateStrategy.type | default "RollingUpdate" }}
    {{- if eq (.Values.statefulset.updateStrategy.type | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.statefulset.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nexus3.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nexus3.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.persistence.enabled .Values.volumePermissions.enabled }}
      initContainers:
        - name: init-permissions
          image: {{ .Values.volumePermissions.image | default "busybox" }}
          command:
            - sh
            - -c
            - |
              chown -R {{ .Values.podSecurityContext.runAsUser | default 1001 }}:{{ .Values.podSecurityContext.runAsGroup | default 1001 }} /nexus-data
              chmod -R g+rwX /nexus-data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data-vol
              mountPath: /nexus-data
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 180
            httpGet:
              path: /
              port: http
          livenessProbe:
            initialDelaySeconds: 0
            periodSeconds: 60
            timeoutSeconds: 1
            failureThreshold: 6
            httpGet:
              path: /service/rest/v1/status
              port: http
          readinessProbe:
            initialDelaySeconds: 0
            periodSeconds: 60
            timeoutSeconds: 1
            failureThreshold: 6
            httpGet:
              path: /service/rest/v1/status
              port: http
          env:
          {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
              protocol: TCP
          {{- range .Values.extra.ports }}
            - containerPort: {{ .port  }}
              name: {{ .name }}
              protocol: TCP
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data-vol
              mountPath: /nexus-data
            {{- end }}
          {{- with .Values.extra.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- with .Values.extra.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data-vol
        labels:
          {{- include "nexus3.labels" . | nindent 10 }}
      spec:
        storageClassName: {{ .Values.persistence.storageClassName }}
        accessModes:
          {{- with .Values.persistence.accessModes }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.storageVolume }}
  {{- end }}
